[component]
name = "polyqlabs-backend"
version = "0.1.0"
kind = "service"
description = "PolyQ Labs central backend circuits — gateway routing, billing, admin RBAC, tenant provisioning"

[component.provides]
circuits = [
    "gateway/gateway_router",
    "gateway/gateway_auth",
    "gateway/gateway_rate_limit",
    "billing/billing_subscription",
    "billing/billing_metering",
    "billing/billing_blinded",
    "billing/billing_settlement",
    "admin/admin_rbac",
    "admin/admin_audit",
    "admin/admin_provisioning",
    "graphs/tenant_graph",
    "graphs/billing_dag",
]

[component.requires]
platform = "0.12.0"
qkit = "0.4.0"

[component.lex]
namespaces = [
    "esn/global/org/polyqlabs/gateway",
    "esn/global/org/polyqlabs/billing",
    "esn/global/org/polyqlabs/admin",
    "esn/global/org/polyqlabs/tenant",
]

[component.signing]
algorithm = "ml_dsa_87"
attestation = "povc"
