[package]
name = "polyqlabs"
version = "0.1.0"
edition = "0.22.0"
description = "PolyQ Labs central backend — gateway, billing, admin, provisioning"
repository = "https://github.com/polylabs-dev/polyqlabs"
license = "Proprietary"

[platform]
estream = "0.22.0"
qkit = "0.4.0"

[dependencies]
qkit_identity = { path = "../qkit/circuits/identity" }
qkit_metering = { path = "../qkit/circuits/metering" }
qkit_rate_limiter = { path = "../qkit/circuits/rate_limiter" }
qkit_rbac = { path = "../qkit/circuits/rbac" }

[circuits]
path = "circuits"

[codegen]
targets = ["rust", "wasm", "typescript"]

[signing]
algorithm = "ml_dsa_87"

[lex]
root = "esn/global/org/polyqlabs"
